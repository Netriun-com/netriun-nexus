# SPDX-License-Identifier: AGPL-3.0-only

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ccmp
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: ccmp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccmp -d ccmp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://ccmp:testing-only@localhost:5432/ccmp_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/15
      - run: go build ./cmd/nexus ./cmd/migrate-legacy
