# SPDX-License-Identifier: AGPL-3.0-only

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@7999b86c43a865dc79d8923397f35af22de63401 # v4
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          category: /language:go
