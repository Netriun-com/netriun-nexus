name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '31 3 * * *'

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/netriun-com
  IMAGE_NAME: netriun-nexus
  IMAGE_TAG: ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate image
        run: make image-check REVISION="$GITHUB_SHA"
      - name: Save image
        run: make image-save IMAGES_DIR="$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-image
          path: ${{ runner.temp }}/images/netriun-nexus.tar
          if-no-files-found: error
          retention-days: 1

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-image
          path: ${{ runner.temp }}/images
      - name: Scan image
        run: make image-scan IMAGES_DIR="$RUNNER_TEMP/images" TRIVY_CACHE="$RUNNER_TEMP/trivy-cache"

  publish:
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-image
          path: ${{ runner.temp }}/images
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Publish exact tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker load --quiet --input "$RUNNER_TEMP/images/netriun-nexus.tar"
          tags=("sha-$GITHUB_SHA")
          case "$GITHUB_REF" in
            refs/heads/main) tags+=(main) ;;
            refs/tags/v*) tags+=("${GITHUB_REF#refs/tags/}" "${GITHUB_REF#refs/tags/v}") ;;
            *) echo "unexpected ref $GITHUB_REF" >&2; exit 1 ;;
          esac
          for tag in "${tags[@]}"; do
            docker tag "$IMAGE_REPO/$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_REPO/$IMAGE_NAME:$tag"
            docker push --quiet "$IMAGE_REPO/$IMAGE_NAME:$tag"
          done
          digest="$(docker image inspect "$IMAGE_REPO/$IMAGE_NAME:${tags[0]}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^$IMAGE_REPO/$IMAGE_NAME@sha256:" | head -n 1)"
          test -n "$digest"
          cosign sign --yes "$digest"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/images.yml@${{ github.ref }}" "$digest" >/dev/null
          echo "Published and signed \`$digest\` (${tags[*]})" >> "$GITHUB_STEP_SUMMARY"
