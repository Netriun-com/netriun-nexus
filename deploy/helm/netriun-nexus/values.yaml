# SPDX-License-Identifier: AGPL-3.0-only

replicaCount: 1

image:
  repository: ghcr.io/netriun-com/netriun-nexus
  tag: "0.1.33"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  name: nexus-service
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nexus.netriun.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  deploymentMode: self_hosted
  appOrigin: https://nexus.netriun.com
  cookieSecure: "true"
  trustedProxyCidrs: ""
  smtp:
    host: smtp.gmail.com
    port: "587"
    fromAddress: s.amrei@netriun.com
    fromName: Netriun Nexus

enterprise:
  # Optional proprietary service. Core remains fully functional when empty or
  # unavailable.
  serviceURL: ""
  # Optional Secret containing an offline signed license document.
  licenseSecretName: ""
  licenseSecretKey: license.json

# Create this Secret before installation. It must contain DATABASE_URL,
# REDIS_URL, ENCRYPTION_KEY, ADMIN_USERNAME, ADMIN_EMAIL, ADMIN_PASSWORD,
# SMTP_USERNAME, and SMTP_PASSWORD.
existingSecret: netriun-nexus

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

startupProbe:
  failureThreshold: 30
  periodSeconds: 2
livenessProbe:
  periodSeconds: 15
  timeoutSeconds: 4
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 4

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Optional single-node dependencies for local/on-prem clusters. Production
# installations may leave these disabled and provide managed service URLs in
# existingSecret instead.
postgresql:
  enabled: false
  name: nexus-postgresql
  image: postgres:17-alpine
  username: nexus
  database: nexus
  passwordKey: POSTGRES_PASSWORD
  persistence:
    size: 10Gi
    hostPath: /var/lib/netriun-nexus/postgresql
    nodeName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

valkey:
  enabled: false
  name: nexus-valkey
  # linux/amd64 manifest digest for valkey/valkey:8.1.10-alpine.
  image: valkey/valkey:8.1.10-alpine@sha256:32627109abf6f741121096b45c732f758876803efd7b2e1018ebc0350d117119
  # Kept as nexus-redis so existing REDIS_URL values remain compatible.
  serviceName: nexus-redis
  passwordKey: REDIS_PASSWORD
  persistence:
    size: 2Gi
    hostPath: /var/lib/netriun-nexus/valkey
    nodeName: ""
  # Retain the former Redis PV/PVC during the rollback window. These resources
  # are not mounted by Valkey and require explicit approval before cleanup.
  legacyRedisStorage:
    enabled: false
    pvName: nexus-redis-pv
    pvcName: nexus-redis
    size: 2Gi
    hostPath: /var/lib/netriun-nexus/redis
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
