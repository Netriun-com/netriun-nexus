# SPDX-License-Identifier: AGPL-3.0-only

fullnameOverride: nexus

image:
  repository: ghcr.io/netriun-com/netriun-nexus
  tag: "0.1.33"
  pullPolicy: IfNotPresent

service:
  name: nexus-service
  type: ClusterIP
  port: 80
  targetPort: 8080

# Cloudflare terminates public TLS and forwards to the ClusterIP service over
# the cluster network. No Kubernetes Ingress is needed on this cluster.
ingress:
  enabled: false

config:
  appOrigin: https://nexus.netriun.com
  cookieSecure: "true"
  trustedProxyCidrs: "10.244.0.0/16"
  smtp:
    host: smtp.gmail.com
    port: "587"
    fromAddress: s.amrei@netriun.com
    fromName: Netriun Nexus

existingSecret: netriun-nexus

postgresql:
  enabled: true
  persistence:
    nodeName: k8s-node01

valkey:
  enabled: true
  persistence:
    nodeName: k8s-node01
  legacyRedisStorage:
    enabled: true
