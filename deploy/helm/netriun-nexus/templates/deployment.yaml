apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netriun-nexus.fullname" . }}
  labels:
    {{- include "netriun-nexus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "netriun-nexus.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "netriun-nexus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "netriun-nexus.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nexus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "netriun-nexus.fullname" . }}
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.enterprise.licenseSecretName .Values.enterprise.serviceURL }}
          volumeMounts:
            {{- if .Values.enterprise.licenseSecretName }}
            - name: enterprise-license
              mountPath: /var/run/netriun/license
              readOnly: true
            {{- end }}
            {{- if and .Values.enterprise.serviceURL (eq .Values.enterprise.auth.mode "spiffe") }}
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            {{- end }}
            {{- if and .Values.enterprise.serviceURL (eq .Values.enterprise.auth.mode "files") }}
            - name: enterprise-mtls
              mountPath: /var/run/netriun/enterprise-mtls
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.enterprise.licenseSecretName .Values.enterprise.serviceURL }}
      volumes:
        {{- if .Values.enterprise.licenseSecretName }}
        - name: enterprise-license
          secret:
            secretName: {{ .Values.enterprise.licenseSecretName | quote }}
            items:
              - key: {{ .Values.enterprise.licenseSecretKey | quote }}
                path: license.json
        {{- end }}
        {{- if and .Values.enterprise.serviceURL (eq .Values.enterprise.auth.mode "spiffe") }}
        - name: spiffe-workload-api
          hostPath:
            path: {{ required "enterprise.auth.spiffe.socketHostPath is required" .Values.enterprise.auth.spiffe.socketHostPath | quote }}
            type: Directory
        {{- end }}
        {{- if and .Values.enterprise.serviceURL (eq .Values.enterprise.auth.mode "files") }}
        - name: enterprise-mtls
          secret:
            secretName: {{ required "enterprise.auth.files.secretName is required" .Values.enterprise.auth.files.secretName | quote }}
            items:
              - key: {{ .Values.enterprise.auth.files.caKey | quote }}
                path: ca.crt
              - key: {{ .Values.enterprise.auth.files.clientCertKey | quote }}
                path: tls.crt
              - key: {{ .Values.enterprise.auth.files.clientKeyKey | quote }}
                path: tls.key
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
