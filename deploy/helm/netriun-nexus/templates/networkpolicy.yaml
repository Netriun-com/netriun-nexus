{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.webIngressFrom }}
{{- fail "networkPolicy.webIngressFrom must list at least one peer when networkPolicy.enabled is true" }}
{{- end }}
# Web pods accept HTTP only from the configured peers, such as the namespace of
# a Cloudflare Tunnel connector. Kubelet probes from the node are always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "netriun-nexus.fullname" . }}-web
  labels:
    {{- include "netriun-nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "netriun-nexus.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.webIngressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- if .Values.worker.enabled }}
---
# Workers serve no application traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "netriun-nexus.workerFullname" . }}
  labels:
    {{- include "netriun-nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "netriun-nexus.workerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.postgresql.name }}
  labels:
    {{- include "netriun-nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.postgresql.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "netriun-nexus.selectorLabels" . | nindent 14 }}
        {{- if .Values.worker.enabled }}
        - podSelector:
            matchLabels:
              {{- include "netriun-nexus.workerSelectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- if .Values.valkey.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.valkey.name }}
  labels:
    {{- include "netriun-nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.valkey.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "netriun-nexus.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- end }}
