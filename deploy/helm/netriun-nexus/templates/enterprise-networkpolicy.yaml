{{- if .Values.enterprise.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "netriun-nexus.fullname" . }}-enterprise-ingress
  labels:
    {{- include "netriun-nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.enterprise.networkPolicy.enterprisePodLabels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "netriun-nexus.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: {{ .Values.enterprise.networkPolicy.port }}
{{- end }}
