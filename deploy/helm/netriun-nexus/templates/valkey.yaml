{{- if .Values.valkey.enabled }}
{{- if .Values.valkey.legacyRedisStorage.enabled }}
# The pre-Valkey Redis storage is intentionally retained for the rollback
# window. It is not mounted by Valkey and must not be removed automatically.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.valkey.legacyRedisStorage.pvName }}
  labels:
    app.kubernetes.io/name: {{ .Values.valkey.legacyRedisStorage.pvcName }}
    app.kubernetes.io/component: legacy-redis-storage
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.valkey.legacyRedisStorage.size }}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ .Values.valkey.legacyRedisStorage.hostPath | quote }}
    type: DirectoryOrCreate
  {{- with .Values.valkey.persistence.nodeName }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ . | quote }}]
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.valkey.legacyRedisStorage.pvcName }}
  labels:
    app.kubernetes.io/component: legacy-redis-storage
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.valkey.legacyRedisStorage.size }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.valkey.legacyRedisStorage.pvcName }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.valkey.name }}-pv
  labels:
    app.kubernetes.io/name: {{ .Values.valkey.name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.valkey.persistence.size }}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ .Values.valkey.persistence.hostPath | quote }}
    type: DirectoryOrCreate
  {{- with .Values.valkey.persistence.nodeName }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ . | quote }}]
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.valkey.name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.valkey.persistence.size }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.valkey.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.valkey.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.valkey.name }}
spec:
  clusterIP: None
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
  selector:
    app.kubernetes.io/name: {{ .Values.valkey.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.valkey.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.valkey.name }}
spec:
  serviceName: {{ .Values.valkey.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.valkey.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.valkey.name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.valkey.persistence.nodeName }}
      nodeSelector:
        kubernetes.io/hostname: {{ . | quote }}
      {{- end }}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.valkey.passwordKey }}
          command: [sh, -c]
          args: ['exec valkey-server --appendonly yes --requirepass "$REDIS_PASSWORD"']
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: [sh, -c, 'valkey-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'valkey-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG']
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.valkey.name }}
{{- end }}
