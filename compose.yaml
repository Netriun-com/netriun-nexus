name: netriun-nexus
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      HTTP_ADDR: :8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      ENTERPRISE_SERVICE_URL: ${ENTERPRISE_SERVICE_URL:-}
      ENTERPRISE_LICENSE_PATH: ${ENTERPRISE_LICENSE_PATH:-}
      ENTERPRISE_AUTH_MODE: ${ENTERPRISE_AUTH_MODE:-}
      SPIFFE_ENDPOINT_SOCKET: ${SPIFFE_ENDPOINT_SOCKET:-}
      ENTERPRISE_SPIFFE_SERVER_ID: ${ENTERPRISE_SPIFFE_SERVER_ID:-}
      ENTERPRISE_MTLS_CA_FILE: ${ENTERPRISE_MTLS_CA_FILE:-}
      ENTERPRISE_MTLS_CLIENT_CERT_FILE: ${ENTERPRISE_MTLS_CLIENT_CERT_FILE:-}
      ENTERPRISE_MTLS_CLIENT_KEY_FILE: ${ENTERPRISE_MTLS_CLIENT_KEY_FILE:-}
      ENTERPRISE_MTLS_SERVER_NAME: ${ENTERPRISE_MTLS_SERVER_NAME:-}
      DATABASE_URL: postgres://ccmp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ccmp?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@valkey:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?Set SMTP_FROM_ADDRESS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Netriun Nexus}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 4s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ccmp
      POSTGRES_DB: ccmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccmp -d ccmp"]
      interval: 5s
      timeout: 3s
      retries: 10
  valkey:
    image: valkey/valkey:8.1.10-alpine@sha256:32627109abf6f741121096b45c732f758876803efd7b2e1018ebc0350d117119
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  valkey-data:
  # Kept declared for rollback of pre-Valkey developer environments.
  redis-data:
